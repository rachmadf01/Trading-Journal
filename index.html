<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7C3AED" id="meta-theme">
<meta name="description" content="Offline trading PnL journal">
<title>Trading PnL Journal</title>
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --purple-50:#F5F3FF;
  --purple-100:#EDE9FE;
  --purple-200:#DDD6FE;
  --purple-300:#C4B5FD;
  --purple-400:#A78BFA;
  --purple-500:#8B5CF6;
  --purple-600:#7C3AED;
  --purple-700:#6D28D9;
  --purple-800:#5B21B6;
  --purple-900:#4C1D95;

  --win:#16A34A;
  --win-soft:#DCFCE7;
  --loss:#DC2626;
  --loss-soft:#FEE2E2;
  --neutral:#64748B;

  --radius-sm:8px;
  --radius:12px;
  --radius-lg:16px;
  --radius-xl:20px;

  --shadow-1:0 1px 2px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.08);
  --shadow-2:0 4px 6px -1px rgba(0,0,0,.08), 0 2px 4px -2px rgba(0,0,0,.06);
  --shadow-3:0 10px 20px -5px rgba(0,0,0,.12), 0 4px 8px -4px rgba(0,0,0,.08);
  --shadow-sheet:0 -4px 24px rgba(0,0,0,.18);

  --safe-top:env(safe-area-inset-top, 0px);
  --safe-bottom:env(safe-area-inset-bottom, 0px);
}

/* LIGHT THEME */
[data-theme="light"]{
  --bg:#F6F5FB;
  --bg-elev:#FFFFFF;
  --surface:#FFFFFF;
  --surface-2:#FAFAFC;
  --surface-3:#F1F0F7;
  --border:#E6E3F0;
  --border-strong:#D4CFE6;
  --text:#1A1625;
  --text-2:#5B5566;
  --text-3:#8E8898;
  --primary:#7C3AED;
  --primary-text:#FFFFFF;
  --primary-soft:#F5F3FF;
  --on-primary:#FFFFFF;
  --win-text:#15803D;
  --loss-text:#B91C1C;
  --win-bg:#DCFCE7;
  --loss-bg:#FEE2E2;
  --chip-bg:#F1F0F7;
  --chip-active-bg:#7C3AED;
  --chip-active-text:#FFFFFF;
  --nav-bg:#FFFFFF;
  --nav-border:#E6E3F0;
  --nav-active:#7C3AED;
  --nav-inactive:#8E8898;
  --overlay:rgba(20,16,32,.5);
  --skeleton:#EEEAF6;
}

/* DARK THEME */
[data-theme="dark"]{
  --bg:#0F0D17;
  --bg-elev:#1A1726;
  --surface:#1A1726;
  --surface-2:#221E33;
  --surface-3:#2A2540;
  --border:#2E2940;
  --border-strong:#3D3656;
  --text:#F4F2FA;
  --text-2:#B8B2C8;
  --text-3:#8A8499;
  --primary:#A78BFA;
  --primary-text:#1A1726;
  --primary-soft:#2A1F4A;
  --on-primary:#0F0D17;
  --win-text:#4ADE80;
  --loss-text:#F87171;
  --win-bg:#0F2E1C;
  --loss-bg:#2E1212;
  --chip-bg:#2A2540;
  --chip-active-bg:#A78BFA;
  --chip-active-text:#0F0D17;
  --nav-bg:#1A1726;
  --nav-border:#2E2940;
  --nav-active:#A78BFA;
  --nav-inactive:#8A8499;
  --overlay:rgba(0,0,0,.65);
  --skeleton:#221E33;
}

/* ============================================================
   RESET / BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.45;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}
input,select,textarea{background:none;border:none;outline:none;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px;}
::-webkit-scrollbar-track{background:transparent;}

/* ============================================================
   APP LAYOUT
   ============================================================ */
#app{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  max-width:520px;margin:0 auto;
  background:var(--bg);
}
@media(min-width:640px){
  #app{box-shadow:0 0 40px rgba(0,0,0,.08);}
}

.topbar{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-top) + 14px) 16px 12px;
  background:var(--bg);
  position:relative;z-index:5;
}
.topbar h1{font-size:20px;font-weight:700;letter-spacing:-.01em;}
.topbar .topbar-actions{display:flex;gap:6px;align-items:center;}
.icon-btn{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-2);
  transition:background .15s,color .15s;
}
.icon-btn:active{background:var(--surface-3);}

main{
  flex:1 1 auto;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:4px 16px 96px;
  position:relative;
}

.view{display:none;animation:fade .2s ease;}
.view.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* ============================================================
   BOTTOM NAV
   ============================================================ */
.bottom-nav{
  flex:0 0 auto;
  display:flex;
  background:var(--nav-bg);
  border-top:1px solid var(--nav-border);
  padding-bottom:var(--safe-bottom);
  position:relative;z-index:10;
}
.nav-item{
  flex:1;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 4px;min-height:56px;
  color:var(--nav-inactive);
  transition:color .15s;
  font-size:11px;font-weight:500;
}
.nav-item.active{color:var(--nav-active);}
.nav-item svg{width:22px;height:22px;}

/* ============================================================
   FAB
   ============================================================ */
.fab{
  position:absolute;
  right:18px;bottom:calc(72px + var(--safe-bottom));
  width:56px;height:56px;border-radius:18px;
  background:var(--purple-600);color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-3);
  z-index:9;
  transition:transform .15s,opacity .15s;
}
[data-theme="dark"] .fab{background:var(--purple-500);}
.fab:active{transform:scale(.94);}
.fab svg{width:26px;height:26px;}
.fab.hidden{opacity:0;pointer-events:none;transform:scale(.6);}

/* ============================================================
   CARDS / SECTIONS
   ============================================================ */
.section-title{
  font-size:13px;font-weight:600;
  color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;
  margin:18px 0 10px;
}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:16px;
  box-shadow:var(--shadow-1);
}

/* ============================================================
   DASHBOARD - STAT GRID
   ============================================================ */
.period-tabs{
  display:flex;gap:6px;
  margin:2px 0 14px;
  overflow-x:auto;
  scrollbar-width:none;
  -ms-overflow-style:none;
}
.period-tabs::-webkit-scrollbar{display:none;}
.period-tab{
  flex:0 0 auto;
  padding:8px 14px;border-radius:20px;
  background:var(--chip-bg);
  color:var(--text-2);
  font-size:13px;font-weight:500;
  white-space:nowrap;
  transition:background .15s,color .15s;
  min-height:36px;display:flex;align-items:center;
}
.period-tab.active{background:var(--chip-active-bg);color:var(--chip-active-text);}

.hero-pnl{
  background:linear-gradient(135deg,var(--purple-600),var(--purple-800));
  color:#fff;
  border-radius:var(--radius-xl);
  padding:22px 20px;
  box-shadow:var(--shadow-2);
  position:relative;overflow:hidden;
}
[data-theme="dark"] .hero-pnl{background:linear-gradient(135deg,var(--purple-700),var(--purple-900));}
.hero-pnl::after{
  content:"";position:absolute;right:-30px;top:-30px;
  width:140px;height:140px;border-radius:50%;
  background:rgba(255,255,255,.08);
}
.hero-label{font-size:13px;opacity:.85;font-weight:500;}
.hero-value{font-size:32px;font-weight:700;margin-top:4px;letter-spacing:-.02em;}
.hero-sub{display:flex;gap:18px;margin-top:14px;font-size:13px;position:relative;z-index:1;}
.hero-sub .sub-val{font-weight:600;}
.hero-sub .sub-val.win{color:#86EFAC;}
.hero-sub .sub-val.loss{color:#FCA5A5;}

.stat-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;
}
.stat-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;
}
.stat-card .lbl{font-size:12px;color:var(--text-3);font-weight:500;}
.stat-card .val{font-size:18px;font-weight:700;margin-top:4px;letter-spacing:-.01em;}
.stat-card .val.win{color:var(--win-text);}
.stat-card .val.loss{color:var(--loss-text);}
.stat-card .sub{font-size:11px;color:var(--text-3);margin-top:2px;}

/* ============================================================
   CALENDAR
   ============================================================ */
.cal-header{
  display:flex;align-items:center;justify-content:space-between;
  margin:2px 0 12px;
}
.cal-month{font-size:18px;font-weight:700;}
.cal-nav{display:flex;gap:4px;}
.cal-nav-btn{
  min-width:40px;height:40px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-2);
}
.cal-nav-btn:active{background:var(--surface-3);}
.cal-nav-btn.today{font-size:13px;font-weight:600;padding:0 12px;border-radius:20px;color:var(--primary);}
.cal-nav-btn svg{width:20px;height:20px;}

.cal-weekdays{
  display:grid;grid-template-columns:repeat(7,1fr);
  text-align:center;font-size:11px;font-weight:600;
  color:var(--text-3);text-transform:uppercase;
  margin-bottom:6px;
}
.cal-grid{
  display:grid;grid-template-columns:repeat(7,1fr);
  gap:4px;
}
.cal-day{
  aspect-ratio:1/1.05;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:6px 5px;
  display:flex;flex-direction:column;
  justify-content:space-between;
  position:relative;
  min-width:0;overflow:hidden;
  transition:background .12s,border-color .12s;
}
.cal-day:active{background:var(--surface-3);}
.cal-day.empty{background:transparent;border:none;}
.cal-day.today{border-color:var(--primary);border-width:2px;}
.cal-day.selected{background:var(--primary-soft);border-color:var(--primary);}
.cal-day .d-num{font-size:13px;font-weight:600;color:var(--text);}
.cal-day.empty .d-num{color:var(--text-3);}
.cal-day .d-trades{font-size:10px;color:var(--text-3);font-weight:500;line-height:1.2;}
.cal-day .d-pnl{font-size:11px;font-weight:700;line-height:1.2;margin-top:2px;}
.cal-day .d-pnl.win{color:var(--win-text);}
.cal-day .d-pnl.loss{color:var(--loss-text);}
.cal-day .d-pnl.flat{color:var(--text-3);}

/* ============================================================
   DAILY DETAIL
   ============================================================ */
.daily-summary{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;
  margin:6px 0 14px;
}
.daily-summary .cell{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:10px;
  text-align:center;
}
.daily-summary .cell .v{font-size:15px;font-weight:700;}
.daily-summary .cell .l{font-size:10px;color:var(--text-3);font-weight:500;text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}

.back-bar{
  display:flex;align-items:center;gap:6px;
  margin:2px 0 10px;
}
.back-bar .back-btn{
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-2);
}
.back-bar .back-btn:active{background:var(--surface-3);}
.back-bar h2{font-size:17px;font-weight:700;}
.back-bar .back-btn svg{width:22px;height:22px;}

/* ============================================================
   TRADE LIST
   ============================================================ */
.trade-item{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:12px 14px;
  margin-bottom:8px;
  display:flex;align-items:center;gap:12px;
  transition:background .12s;
}
.trade-item:active{background:var(--surface-2);}
.trade-badge{
  width:44px;height:44px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;text-transform:uppercase;
  flex:0 0 auto;
}
.trade-badge.win{background:var(--win-bg);color:var(--win-text);}
.trade-badge.loss{background:var(--loss-bg);color:var(--loss-text);}
.trade-main{flex:1;min-width:0;}
.trade-pnl{font-size:16px;font-weight:700;letter-spacing:-.01em;}
.trade-pnl.win{color:var(--win-text);}
.trade-pnl.loss{color:var(--loss-text);}
.trade-meta{font-size:12px;color:var(--text-3);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;}
.trade-meta .sep{opacity:.5;}
.trade-actions{display:flex;gap:2px;flex:0 0 auto;}
.trade-action-btn{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-3);
}
.trade-action-btn:active{background:var(--surface-3);}
.trade-action-btn svg{width:18px;height:18px;}

/* ============================================================
   FILTERS
   ============================================================ */
.filter-chips{
  display:flex;gap:6px;
  overflow-x:auto;
  scrollbar-width:none;
  margin:2px 0 12px;
  padding-bottom:2px;
}
.filter-chips::-webkit-scrollbar{display:none;}
.filter-chip{
  flex:0 0 auto;
  padding:6px 12px;border-radius:16px;
  background:var(--chip-bg);color:var(--text-2);
  font-size:12px;font-weight:500;
  white-space:nowrap;min-height:32px;
  display:flex;align-items:center;
}
.filter-chip.active{background:var(--chip-active-bg);color:var(--chip-active-text);}

/* ============================================================
   FORMS / INPUTS
   ============================================================ */
.field{margin-bottom:14px;}
.field-label{
  display:block;font-size:12px;font-weight:600;
  color:var(--text-2);margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.04em;
}
.input,select,textarea{
  width:100%;
  background:var(--surface-2);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  padding:12px 14px;
  font-size:15px;
  color:var(--text);
  transition:border-color .15s,background .15s;
  min-height:46px;
}
.input:focus,select:focus,textarea:focus{
  border-color:var(--primary);
  background:var(--surface);
}
textarea{resize:vertical;min-height:70px;}
input[type="date"]{color-scheme:light dark;}
[data-theme="dark"] input[type="date"]{color-scheme:dark;}

.wl-toggle{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
}
.wl-btn{
  padding:14px;border-radius:var(--radius);
  border:2px solid var(--border);
  background:var(--surface-2);
  display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:14px;font-weight:600;
  color:var(--text-2);
  min-height:64px;
  transition:all .15s;
}
.wl-btn svg{width:20px;height:20px;}
.wl-btn.active.win{border-color:var(--win);background:var(--win-bg);color:var(--win-text);}
.wl-btn.active.loss{border-color:var(--loss);background:var(--loss-bg);color:var(--loss-text);}

/* ============================================================
   BOTTOM SHEET
   ============================================================ */
.sheet-overlay{
  position:fixed;inset:0;
  background:var(--overlay);
  z-index:100;
  opacity:0;pointer-events:none;
  transition:opacity .25s;
}
.sheet-overlay.open{opacity:1;pointer-events:auto;}
.sheet{
  position:absolute;left:0;right:0;bottom:0;
  max-width:520px;margin:0 auto;
  background:var(--bg-elev);
  border-radius:var(--radius-xl) var(--radius-xl) 0 0;
  padding:8px 18px calc(24px + var(--safe-bottom));
  max-height:92vh;overflow-y:auto;
  transform:translateY(100%);
  transition:transform .28s cubic-bezier(.32,.72,0,1);
  box-shadow:var(--shadow-sheet);
}
.sheet-overlay.open .sheet{transform:translateY(0);}
.sheet-handle{
  width:36px;height:4px;border-radius:2px;
  background:var(--border-strong);
  margin:0 auto 14px;
}
.sheet-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;
}
.sheet-title{font-size:18px;font-weight:700;}
.sheet-actions{display:flex;gap:8px;margin-top:18px;}
.btn{
  flex:1;
  padding:14px;border-radius:var(--radius);
  font-size:15px;font-weight:600;
  min-height:48px;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,transform .1s;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--purple-600);color:#fff;}
[data-theme="dark"] .btn-primary{background:var(--purple-500);color:var(--on-primary);}
.btn-ghost{background:var(--surface-3);color:var(--text-2);}
.btn-danger{background:var(--loss);color:#fff;}
.btn-outline{background:transparent;border:1.5px solid var(--border-strong);color:var(--text);}

/* ============================================================
   DIALOG (CONFIRM)
   ============================================================ */
.dialog-overlay{
  position:fixed;inset:0;
  background:var(--overlay);
  z-index:200;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  opacity:0;pointer-events:none;
  transition:opacity .2s;
}
.dialog-overlay.open{opacity:1;pointer-events:auto;}
.dialog{
  background:var(--bg-elev);
  border-radius:var(--radius-lg);
  padding:22px 20px;
  max-width:340px;width:100%;
  transform:scale(.92);
  transition:transform .2s;
  box-shadow:var(--shadow-3);
}
.dialog-overlay.open .dialog{transform:scale(1);}
.dialog-title{font-size:18px;font-weight:700;margin-bottom:8px;}
.dialog-body{font-size:14px;color:var(--text-2);line-height:1.5;margin-bottom:20px;}
.dialog-actions{display:flex;gap:8px;}
.dialog-actions .btn{flex:1;}

/* ============================================================
   TOAST
   ============================================================ */
.toast{
  position:fixed;
  left:50%;bottom:calc(90px + var(--safe-bottom));
  transform:translateX(-50%) translateY(80px);
  background:#1F1B2E;color:#fff;
  padding:12px 18px;border-radius:24px;
  font-size:13px;font-weight:500;
  box-shadow:var(--shadow-3);
  z-index:300;
  opacity:0;pointer-events:none;
  transition:transform .25s,opacity .25s;
  max-width:90vw;white-space:nowrap;
}
[data-theme="light"] .toast{background:#2A1F4A;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.toast.error{background:var(--loss);}
.toast.success{background:var(--win);}

/* ============================================================
   EMPTY STATE
   ============================================================ */
.empty-state{
  text-align:center;padding:50px 20px;
  color:var(--text-3);
}
.empty-state svg{width:56px;height:56px;margin-bottom:14px;opacity:.5;}
.empty-state h3{font-size:16px;font-weight:600;color:var(--text-2);margin-bottom:6px;}
.empty-state p{font-size:13px;line-height:1.5;}

/* ============================================================
   CHART
   ============================================================ */
.chart-wrap{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:16px;
  margin-bottom:12px;
}
.chart-title{font-size:14px;font-weight:600;margin-bottom:4px;}
.chart-sub{font-size:12px;color:var(--text-3);margin-bottom:12px;}
.chart-svg{width:100%;height:auto;display:block;overflow:visible;}

/* ============================================================
   SETTINGS
   ============================================================ */
.setting-group{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  overflow:hidden;
  margin-bottom:14px;
}
.setting-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;
  border-bottom:1px solid var(--border);
  gap:12px;
}
.setting-row:last-child{border-bottom:none;}
.setting-row .lbl{font-size:14px;font-weight:500;flex:1;}
.setting-row .desc{font-size:12px;color:var(--text-3);margin-top:2px;}
.setting-row .ctrl{flex:0 0 auto;display:flex;align-items:center;gap:8px;}

/* segmented control */
.segmented{
  display:flex;background:var(--surface-3);
  border-radius:10px;padding:2px;
}
.segmented button{
  padding:6px 12px;border-radius:8px;
  font-size:12px;font-weight:600;
  color:var(--text-2);
  min-height:32px;
  transition:background .15s,color .15s;
}
.segmented button.active{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-1);}

.setting-input{
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:8px 10px;
  width:110px;text-align:right;
  font-size:14px;
}

/* switch */
.switch{
  width:46px;height:26px;border-radius:13px;
  background:var(--surface-3);
  position:relative;
  transition:background .2s;
  flex:0 0 auto;
}
.switch.on{background:var(--purple-600);}
[data-theme="dark"] .switch.on{background:var(--purple-500);}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;
  width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:var(--shadow-1);
  transition:transform .2s;
}
.switch.on::after{transform:translateX(20px);}

<script>
/* ============================================================
   TRADING PNL JOURNAL — single-file offline app
   Architecture: Store (data) | Stats (calc) | UI (render)
   ============================================================ */
(function(){
'use strict';

/* ============================================================
   UTILITIES
   ============================================================ */
const $ = (s, ctx=document) => ctx.querySelector(s);
const $$ = (s, ctx=document) => Array.from(ctx.querySelectorAll(s));

function uid(){
  return 't_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
}

function todayStr(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function parseDate(s){
  // expects YYYY-MM-DD -> Date at local midnight
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}

function fmtDateLong(s){
  const d = parseDate(s);
  return d.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});
}
function fmtDateMed(s){
  const d = parseDate(s);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}
function fmtDateShort(s){
  const d = parseDate(s);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}

function fmtPnL(amount){
  if(amount === null || amount === undefined || isNaN(amount)) amount = 0;
  const sign = amount > 0 ? '+' : (amount < 0 ? '-' : '');
  const abs = Math.abs(amount);
  return sign + '$' + abs.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtMoney(amount){
  if(amount === null || amount === undefined || isNaN(amount)) amount = 0;
  return '$' + Math.abs(amount).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtPct(p){
  if(p === null || p === undefined || isNaN(p)) p = 0;
  return p.toFixed(1) + '%';
}

function clamp(n,min,max){return Math.max(min,Math.min(max,n));}

function toast(msg, type){
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show ' + (type||'');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ el.className = 'toast ' + (type||''); }, 2400);
}

/* ============================================================
   STORE — Data Layer
   ============================================================ */
const Store = {
  KEY_TRADES: 'tpj_trades_v1',
  KEY_SETTINGS: 'tpj_settings_v1',
  KEY_META: 'tpj_meta_v1',
  _cache: null,
  _settings: null,

  defaultSettings(){
    return {
      theme: 'system', // light | dark | system
      startingBalance: 0,
      maxDrawdown: 0,
      dailyDrawdown: 0,
      profitTarget: 0,
      weekStart: 'mon' // mon | sun
    };
  },

  _load(key, fallback){
    try{
      const raw = localStorage.getItem(key);
      if(raw === null) return fallback;
      return JSON.parse(raw);
    }catch(e){
      console.warn('Storage read failed for', key, e);
      return fallback;
    }
  },

  _save(key, val){
    try{
      localStorage.setItem(key, JSON.stringify(val));
      return true;
    }catch(e){
      console.error('Storage write failed', key, e);
      toast('Storage error: could not save data','error');
      return false;
    }
  },

  getTrades(){
    if(this._cache !== null) return this._cache;
    let data = this._load(this.KEY_TRADES, null);
    if(data === null){
      this._cache = [];
      return this._cache;
    }
    if(!Array.isArray(data)){
      // corrupted — back up and reset
      this._save('tpj_trades_backup_' + Date.now(), data);
      console.warn('Trades data corrupted, reset to empty');
      this._cache = [];
      return this._cache;
    }
    // validate / sanitize
    this._cache = data.map(t => this._sanitizeTrade(t)).filter(Boolean);
    // if any were dropped, persist cleaned version
    if(this._cache.length !== data.length){
      this._save(this.KEY_TRADES, this._cache);
    }
    return this._cache;
  },

  _sanitizeTrade(t){
    if(!t || typeof t !== 'object') return null;
    if(!t.id || typeof t.id !== 'string') return null;
    if(!t.date || typeof t.date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(t.date)) return null;
    if(t.result !== 'win' && t.result !== 'loss') return null;
    const pnl = Number(t.pnl);
    if(isNaN(pnl)) return null;
    return {
      id: t.id,
      date: t.date,
      timestamp: typeof t.timestamp === 'number' ? t.timestamp : (t.timestamp ? Date.parse(t.timestamp) || Date.now() : Date.now()),
      result: t.result,
      pnl: pnl,
      symbol: typeof t.symbol === 'string' ? t.symbol : '',
      notes: typeof t.notes === 'string' ? t.notes : '',
      entryTime: typeof t.entryTime === 'string' ? t.entryTime : ''
    };
  },

  getSettings(){
    if(this._settings !== null) return this._settings;
    let s = this._load(this.KEY_SETTINGS, null);
    if(s === null || typeof s !== 'object'){
      s = this.defaultSettings();
      this._save(this.KEY_SETTINGS, s);
    }
    // merge with defaults to handle new keys
    const def = this.defaultSettings();
    this._settings = Object.assign({}, def, s);
    return this._settings;
  },

  saveSettings(s){
    this._settings = Object.assign({}, this.getSettings(), s);
    this._save(this.KEY_SETTINGS, this._settings);
    return this._settings;
  },

  saveTrades(){
    if(this._cache !== null){
      return this._save(this.KEY_TRADES, this._cache);
    }
    return false;
  },

  addTrade(t){
    const trades = this.getTrades();
    const trade = this._sanitizeTrade(Object.assign({id: uid(), timestamp: Date.now()}, t));
    if(!trade) return null;
    trades.push(trade);
    this.saveTrades();
    return trade;
  },

  updateTrade(id, patch){
    const trades = this.getTrades();
    const i = trades.findIndex(t => t.id === id);
    if(i < 0) return null;
    const merged = Object.assign({}, trades[i], patch, {id: trades[i].id});
    const clean = this._sanitizeTrade(merged);
    if(!clean) return null;
    trades[i] = clean;
    this.saveTrades();
    return clean;
  },

  deleteTrade(id){
    const trades = this.getTrades();
    const i = trades.findIndex(t => t.id === id);
    if(i < 0) return false;
    trades.splice(i,1);
    this.saveTrades();
    return true;
  },

  duplicateTrade(id){
    const trades = this.getTrades();
    const t = trades.find(x => x.id === id);
    if(!t) return null;
    const copy = Object.assign({}, t, {id: uid(), timestamp: Date.now()});
    trades.push(copy);
    this.saveTrades();
    return copy;
  },

  clearAll(){
    this._cache = [];
    this.saveTrades();
  },

  replaceAll(arr){
    const cleaned = arr.map(t => this._sanitizeTrade(t)).filter(Boolean);
    this._cache = cleaned;
    this.saveTrades();
    return {ok:true, count: cleaned.length, skipped: arr.length - cleaned.length};
  },

  mergeAll(arr){
    const trades = this.getTrades();
    const existing = new Set(trades.map(t => t.id));
    let added = 0, skipped = 0, invalid = 0;
    arr.forEach(t => {
      const clean = this._sanitizeTrade(t);
      if(!clean){ invalid++; return; }
      if(existing.has(clean.id)){ skipped++; return; }
      trades.push(clean);
      existing.add(clean.id);
      added++;
    });
    this.saveTrades();
    return {ok:true, added, skipped, invalid};
  },

  exportJSON(){
    return JSON.stringify({
      version: 1,
      exportedAt: new Date().toISOString(),
      settings: this.getSettings(),
      trades: this.getTrades()
    }, null, 2);
  },

  exportCSV(){
    const trades = this.getTrades();
    const header = ['id','date','timestamp','result','pnl','symbol','entryTime','notes'];
    const rows = trades.map(t => header.map(k => {
      let v = t[k];
      if(k === 'timestamp'){
        v = new Date(v).toISOString();
      }
      if(v === null || v === undefined) v = '';
      v = String(v);
      if(/[",\n]/.test(v)) v = '"' + v.replace(/"/g,'""') + '"';
      return v;
    }));
    return [header.join(','), ...rows.map(r => r.join(','))].join('\n');
  }
};

/* ============================================================
   STATS — Calculation Layer (pure functions, never mutate)
   ============================================================ */
const Stats = {

  // Filter trades by period
  filterByPeriod(trades, period, customRange){
    if(period === 'all') return trades.slice();
    const today = new Date();
    if(period === 'week'){
      const ws = Store.getSettings().weekStart === 'sun' ? 0 : 1;
      const start = new Date(today);
      const day = start.getDay();
      const diff = (day - ws + 7) % 7;
      start.setDate(start.getDate() - diff);
      start.setHours(0,0,0,0);
      const end = new Date(start);
      end.setDate(end.getDate() + 7);
      return trades.filter(t => {
        const d = parseDate(t.date);
        return d >= start && d < end;
      });
    }
    if(period === 'month'){
      const start = new Date(today.getFullYear(), today.getMonth(), 1);
      const end = new Date(today.getFullYear(), today.getMonth()+1, 1);
      return trades.filter(t => {
        const d = parseDate(t.date);
        return d >= start && d < end;
      });
    }
    if(period === 'custom' && customRange){
      const start = parseDate(customRange.start);
      const end = parseDate(customRange.end);
      end.setDate(end.getDate()+1); // inclusive
      return trades.filter(t => {
        const d = parseDate(t.date);
        return d >= start && d < end;
      });
    }
    return trades.slice();
  },

  filterByDateRange(trades, startStr, endStr){
    if(!startStr && !endStr) return trades.slice();
    return trades.filter(t => {
      if(startStr && t.date < startStr) return false;
      if(endStr && t.date > endStr) return false;
      return true;
    });
  },

  // Core: compute stats from a trade array (always trade-level)
  compute(trades){
    const total = trades.length;
    let wins = 0, losses = 0;
    let totalPnl = 0;
    let winsSum = 0, lossesSum = 0;
    let best = null, worst = null;

    for(const t of trades){
      totalPnl += t.pnl;
      if(t.result === 'win'){
        wins++;
        winsSum += t.pnl;
      }else{
        losses++;
        lossesSum += t.pnl;
      }
      if(best === null || t.pnl > best.pnl) best = t;
      if(worst === null || t.pnl < worst.pnl) worst = t;
    }

    const winrate = total === 0 ? 0 : (wins / total) * 100;
    const avg = total === 0 ? 0 : totalPnl / total;
    const avgWin = wins === 0 ? 0 : winsSum / wins;
    const avgLoss = losses === 0 ? 0 : lossesSum / losses;
    // Profit factor: gross profit / gross loss (abs)
    const profitFactor = (lossesSum === 0) ? (winsSum > 0 ? Infinity : 0) : (winsSum / Math.abs(lossesSum));
    const expectancy = total === 0 ? 0 : (winrate/100 * avgWin) + ((100-winrate)/100 * (-Math.abs(avgLoss)));

    return {
      total, wins, losses,
      totalPnl,
      winrate,
      avgPnl: avg,
      avgWin,
      avgLoss,
      best: best ? best.pnl : 0,
      worst: worst ? worst.pnl : 0,
      bestTrade: best,
      worstTrade: worst,
      profitFactor,
      expectancy
    };
  },

  // Group trades by day (YYYY-MM-DD)
  groupByDay(trades){
    const map = {};
    for(const t of trades){
      if(!map[t.date]) map[t.date] = [];
      map[t.date].push(t);
    }
    return map;
  },

  // Daily stats (per date)
  dailyStats(trades){
    const grouped = this.groupByDay(trades);
    const out = [];
    for(const date in grouped){
      out.push(Object.assign({date}, this.compute(grouped[date])));
    }
    out.sort((a,b) => a.date < b.date ? -1 : 1);
    return out;
  },

  // ISO week key: YYYY-Www (Monday-based)
  _weekKey(date, weekStartMon){
    const d = new Date(date);
    const ws = weekStartMon ? 1 : 0;
    const day = d.getDay();
    const diff = (day - ws + 7) % 7;
    d.setDate(d.getDate() - diff);
    const y = d.getFullYear();
    const jan1 = new Date(y,0,1);
    const week = Math.ceil(((d - jan1)/86400000 + jan1.getDay() + 1) / 7);
    return y + '-W' + String(week).padStart(2,'0');
  },

  _weekRange(date, weekStartMon){
    const d = new Date(date);
    const ws = weekStartMon ? 1 : 0;
    const day = d.getDay();
    const diff = (day - ws + 7) % 7;
    const start = new Date(d);
    start.setDate(start.getDate() - diff);
    const end = new Date(start);
    end.setDate(end.getDate() + 6);
    return {start, end};
  },

  groupByWeek(trades){
    const ws = Store.getSettings().weekStart === 'sun' ? false : true;
    const map = {};
    for(const t of trades){
      const k = this._weekKey(parseDate(t.date), ws);
      if(!map[k]) map[k] = [];
      map[k].push(t);
    }
    return map;
  },

  weeklyStats(trades){
    const grouped = this.groupByWeek(trades);
    const ws = Store.getSettings().weekStart === 'sun' ? false : true;
    const out = [];
    for(const k in grouped){
      const range = this._weekRange(parseDate(grouped[k][0].date), ws);
      out.push(Object.assign({key:k, start:range.start, end:range.end, trades: grouped[k]}, this.compute(grouped[k])));
    }
    out.sort((a,b) => a.key < b.key ? -1 : 1);
    return out;
  },

  groupByMonth(trades){
    const map = {};
    for(const t of trades){
      const k = t.date.slice(0,7); // YYYY-MM
      if(!map[k]) map[k] = [];
      map[k].push(t);
    }
    return map;
  },

  monthlyStats(trades){
    const grouped = this.groupByMonth(trades);
    const out = [];
    for(const k in grouped){
      out.push(Object.assign({key:k, trades: grouped[k]}, this.compute(grouped[k])));
    }
    out.sort((a,b) => a.key < b.key ? -1 : 1);
    return out;
  },

  // Cumulative PnL series (chronological)
  cumulativeSeries(trades){
    const sorted = trades.slice().sort((a,b) => {
      if(a.date !== b.date) return a.date < b.date ? -1 : 1;
      return a.timestamp - b.timestamp;
    });
    let cum = 0;
    const series = [];
    for(const t of sorted){
      cum += t.pnl;
      series.push({trade: t, pnl: t.pnl, cumulative: cum});
    }
    return series;
  },

  // Daily PnL series for a date range (fills gaps with 0)
  dailyPnLSeries(trades, startDate, endDate){
    const grouped = this.groupByDay(trades);
    const days = [];
    const cur = new Date(startDate);
    const end = new Date(endDate);
    while(cur <= end){
      const ds = cur.getFullYear() + '-' + String(cur.getMonth()+1).padStart(2,'0') + '-' + String(cur.getDate()).padStart(2,'0');
      const dayTrades = grouped[ds] || [];
      days.push({date: ds, pnl: dayTrades.reduce((s,t)=>s+t.pnl,0), count: dayTrades.length});
      cur.setDate(cur.getDate()+1);
    }
    return days;
  },

  // Drawdown series from cumulative
  drawdownMax(trades){
    const series = this.cumulativeSeries(trades);
    let peak = 0, maxDD = 0;
    for(const p of series){
      if(p.cumulative > peak) peak = p.cumulative;
      const dd = peak - p.cumulative;
      if(dd > maxDD) maxDD = dd;
    }
    return maxDD;
  }
};

/* ============================================================
   CHART — SVG helpers
   ============================================================ */
const Chart = {

  // Cumulative PnL line chart
  cumulativeLine(series, opts={}){
    if(series.length === 0) return '';
    const w = opts.width || 320;
    const h = opts.height || 140;
    const padL = 8, padR = 8, padT = 10, padB = 18;
    const innerW = w - padL - padR;
    const innerH = h - padT - padB;

    let min = 0, max = 0;
    for(const p of series){
      if(p.cumulative < min) min = p.cumulative;
      if(p.cumulative > max) max = p.cumulative;
    }
    if(min === max){ min = min - 1; max = max + 1; }
    const range = max - min;

    const xStep = series.length > 1 ? innerW / (series.length - 1) : 0;
    const y = v => padT + innerH - ((v - min) / range) * innerH;
    const x = i => padL + i * xStep;

    // zero line
    const zeroY = y(0);
    const hasZero = min < 0 && max > 0;

    let pathD = '';
    let areaD = '';
    series.forEach((p,i) => {
      const px = x(i), py = y(p.cumulative);
      pathD += (i === 0 ? 'M' : 'L') + px.toFixed(1) + ' ' + py.toFixed(1) + ' ';
      if(i === 0) areaD += 'M' + px + ' ' + zeroY + ' L' + px + ' ' + py;
      else areaD += ' L' + px + ' ' + py;
    });
    if(series.length > 0){
      const lastX = x(series.length-1);
      areaD += ' L' + lastX + ' ' + zeroY + ' Z';
    }

    const lastVal = series[series.length-1].cumulative;
    const lineColor = lastVal >= 0 ? 'var(--win)' : 'var(--loss)';
    const fillColor = lastVal >= 0 ? 'rgba(22,163,74,.15)' : 'rgba(220,38,38,.15)';

    let svg = `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">`;
    if(hasZero){
      svg += `<line x1="${padL}" y1="${zeroY}" x2="${w-padR}" y2="${zeroY}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 3"/>`;
    }
    svg += `<path d="${areaD}" fill="${fillColor}" stroke="none"/>`;
    svg += `<path d="${pathD}" fill="none" stroke="${lineColor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    // end dot
    if(series.length > 0){
      svg += `<circle cx="${x(series.length-1).toFixed(1)}" cy="${y(lastVal).toFixed(1)}" r="3.5" fill="${lineColor}"/>`;
    }
    svg += `</svg>`;
    return svg;
  },

  // Bar chart (for daily/weekly/monthly PnL)
  bars(data, opts={}){
    if(data.length === 0) return '';
    const w = opts.width || 320;
    const h = opts.height || 140;
    const padL = 8, padR = 8, padT = 10, padB = 22;
    const innerW = w - padL - padR;
    const innerH = h - padT - padB;

    let min = 0, max = 0;
    for(const d of data){
      if(d.value < min) min = d.value;
      if(d.value > max) max = d.value;
    }
    if(min === max){ min = min < 0 ? min - 1 : 0; max = max + 1; }
    const range = max - min || 1;

    const zeroY = padT + innerH - ((0 - min) / range) * innerH;
    const barW = innerW / data.length;
    const gap = Math.max(1, barW * 0.18);
    const bw = Math.max(2, barW - gap);

    let svg = `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">`;
    // zero line
    svg += `<line x1="${padL}" y1="${zeroY}" x2="${w-padR}" y2="${zeroY}" stroke="var(--border)" stroke-width="1"/>`;

    data.forEach((d,i) => {
      const x = padL + i * barW + gap/2;
      const v = d.value;
      const yTop = padT + innerH - ((Math.max(0, v) - min) / range) * innerH;
      const yBot = padT + innerH - ((Math.min(0, v) - min) / range) * innerH;
      const rectY = Math.min(yTop, zeroY);
      const rectH = Math.max(1, Math.abs(yBot - yTop) || Math.abs(zeroY - yTop));
      const color = v >= 0 ? 'var(--win)' : 'var(--loss)';
      svg += `<rect x="${x.toFixed(1)}" y="${rectY.toFixed(1)}" width="${bw.toFixed(1)}" height="${rectH.toFixed(1)}" rx="2" fill="${color}" opacity="0.85"/>`;
      if(d.label && (i % Math.max(1, Math.floor(data.length/6)) === 0)){
        svg += `<text x="${(x+bw/2).toFixed(1)}" y="${h-6}" text-anchor="middle" font-size="9" fill="var(--text-3)">${d.label}</text>`;
      }
    });
    svg += `</svg>`;
    return svg;
  }
};

    this.applyTheme();
    this.bindEvents();
    this.render();

  applyTheme(){
    const s = Store.getSettings();
    let theme = s.theme;
    if(theme === 'system'){
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      theme = prefersDark ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
    const meta = document.getElementById('meta-theme');
    if(meta) meta.content = theme === 'dark' ? '#0F0D17' : '#7C3AED';
  },

  // ---------- NAVIGATION ----------
  go(view){
    this.state.view = view;
    $('#view-title').textContent = this.viewTitles[view] || view;
    $$('.view').forEach(v => v.classList.remove('active'));
    $('#view-' + view).classList.add('active');
    $$('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === view));
    // FAB visibility (hide on settings)
    const fab = $('#fab');
    if(view === 'settings'){ fab.classList.add('hidden'); }
    else { fab.classList.remove('hidden'); }
    // topbar actions
    this.renderTopActions();
    // scroll main to top
    $('#main').scrollTop = 0;
    this.render();
  },

  renderTopActions(){
    const el = $('#topbar-actions');
    el.innerHTML = '';
    // no topbar actions for now
  },

  // ---------- EVENT BINDING ----------
  bindEvents(){
    // bottom nav
    $$('.nav-item').forEach(n => {
      n.addEventListener('click', () => this.go(n.dataset.view));
    });
    // FAB
    $('#fab').addEventListener('click', () => this.openTradeSheet());

    // sheet close
    $('#sheet-close').addEventListener('click', () => this.closeTradeSheet());
    $('#sheet-cancel').addEventListener('click', () => this.closeTradeSheet());
    $('#trade-sheet').addEventListener('click', (e) => {
      if(e.target.id === 'trade-sheet') this.closeTradeSheet();
    });
    // W/L toggle
    $('#wl-win').addEventListener('click', () => this.setSheetResult('win'));
    $('#wl-loss').addEventListener('click', () => this.setSheetResult('loss'));
    // form submit
    $('#trade-form').addEventListener('submit', (e) => {
      e.preventDefault();
      this.saveTradeFromForm();
    });

    // period tabs (dashboard)
    $('#period-tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.period-tab');
      if(!btn) return;
      const p = btn.dataset.period;
      this.state.period = p;
      $$('#period-tabs .period-tab').forEach(b => b.classList.toggle('active', b === btn));
      if(p === 'custom'){
        this.openCustomRangePicker();
      }else{
        this.renderDashboard();
      }
    });

    // stat tabs
    $('#stat-tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.period-tab');
      if(!btn) return;
      this.state.statTab = btn.dataset.stat;
      $$('#stat-tabs .period-tab').forEach(b => b.classList.toggle('active', b === btn));
      this.renderStatistics();
    });

    $('#confirm-cancel').addEventListener('click', () => this.closeConfirm());

      if(e.target.id === 'confirm-dialog') this.closeConfirm();
    });

      if(Store.getSettings().theme === 'system') this.applyTheme();
    });

  // ---------- CALENDAR ----------
  renderCalendar(){
    const trades = Store.getTrades();
    const grouped = Stats.groupByDay(trades);
    const cur = this.state.calendarDate;
    const year = cur.getFullYear();
    const month = cur.getMonth();
    const monthName = cur.toLocaleDateString(undefined,{month:'long',year:'numeric'});

    const ws = Store.getSettings().weekStart === 'sun' ? 0 : 1;
    const weekdays = ws === 0 ? ['S','M','T','W','T','F','S'] : ['M','T','W','T','F','S','S'];

    // Build days
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month+1, 0);
    const startOffset = (firstDay.getDay() - ws + 7) % 7;
    const daysInMonth = lastDay.getDate();
    const today = todayStr();

    let cells = '';
    // leading empties
    for(let i=0;i<startOffset;i++){
      cells += `<div class="cal-day empty"></div>`;
    }
    for(let d=1; d<=daysInMonth; d++){
      const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dayTrades = grouped[ds] || [];
      const count = dayTrades.length;
      const pnl = dayTrades.reduce((s,t)=>s+t.pnl,0);
      const pnlClass = pnl > 0 ? 'win' : (pnl < 0 ? 'loss' : 'flat');
      const isToday = ds === today;
      const isSelected = ds === this.state.selectedDate;
      const tradesLabel = count === 0 ? 'No trades' : (count === 1 ? '1 trade' : count + ' trades');
      const pnlLabel = count === 0 ? '' : fmtPnL(pnl);

      cells += `<div class="cal-day ${isToday?'today':''} ${isSelected?'selected':''}" data-date="${ds}">
        <div class="d-num">${d}</div>
        <div>
          <div class="d-trades">${tradesLabel}</div>
          ${pnlLabel ? `<div class="d-pnl ${pnlClass}">${pnlLabel}</div>` : ''}
        </div>
      </div>`;
    }

    // month summary (this month so far)
    const monthTrades = trades.filter(t => {
      const d = parseDate(t.date);
      return d.getFullYear() === year && d.getMonth() === month;
    });
    const ms = Stats.compute(monthTrades);

      <div class="cal-month">${monthName}</div>

        </button>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </div>`;

    // Month summary card
    html += `<div class="card mb-12" style="padding:12px 14px;">
      <div class="row-flex spread" style="margin-bottom:8px;">
        <div class="fs-12 muted">Month Summary</div>
        <div class="fs-12 fw-700 ${ms.totalPnl > 0 ? 'text-win' : (ms.totalPnl < 0 ? 'text-loss' : '')}">${fmtPnL(ms.totalPnl)}</div>
      </div>
      <div class="row-flex" style="gap:14px;flex-wrap:wrap;">
        <div class="fs-13"><span class="muted">Trades</span> <span class="fw-700">${ms.total}</span></div>
        <div class="fs-13"><span class="muted">Winrate</span> <span class="fw-700">${fmtPct(ms.winrate)}</span></div>
        <div class="fs-13"><span class="muted">W/L</span> <span class="fw-700 text-win">${ms.wins}</span>/<span class="fw-700 text-loss">${ms.losses}</span></div>

    html += `<div class="daily-summary">
      <div class="cell">
        <div class="v ${s.totalPnl > 0 ? 'text-win' : (s.totalPnl < 0 ? 'text-loss' : '')}">${fmtPnL(s.totalPnl)}</div>
        <div class="l">PnL</div>
      </div>
      <div class="cell">
        <div class="v">${fmtPct(s.winrate)}</div>
        <div class="l">Winrate</div>
      </div>
      <div class="cell">
        <div class="v">${s.total}</div>
        <div class="l">Trades</div>
      </div>
    </div>`;

    html += `<div class="row-flex spread mb-12">
      <div class="fs-13 muted">${s.wins}W / ${s.losses}L · Avg ${fmtPnL(s.avgPnl)}</div>
      <button class="btn btn-primary" id="daily-add" style="flex:0 0 auto;padding:10px 16px;min-height:0;font-size:13px;">+ Add Trade</button>
    </div>`;

    if(trades.length === 0){
      html += `<div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <h3>No trades on this day</h3>
        <p>Add a trade to start tracking.</p>
      </div>`;
    }else{
      // sort by timestamp ascending
      trades.sort((a,b) => a.timestamp - b.timestamp);
      for(const t of trades){
        html += this.renderTradeItem(t, true);
      }
    }

    $('#daily-content').innerHTML = html;

    $('#daily-back').addEventListener('click', () => this.go('calendar'));
    $('#daily-add').addEventListener('click', () => {
      this.openTradeSheet({date});
    });
    this.bindTradeItemActions('#daily-content');
  },

  // Render single trade item card
  renderTradeItem(t, showDate){
    const meta = [];
    if(showDate) meta.push(fmtDateMed(t.date));
    if(t.symbol) meta.push(this.escape(t.symbol));
    if(t.entryTime) meta.push(this.escape(t.entryTime));
    const metaHtml = meta.length ? `<div class="trade-meta">${meta.map((m,i) => `<span>${m}</span>${i<meta.length-1?'<span class="sep">·</span>':''}`).join('')}</div>` : '';
    const notesHtml = t.notes ? `<div class="notes-block">${this.escape(t.notes)}</div>` : '';
    return `<div class="trade-item" data-id="${t.id}">
      <div class="trade-badge ${t.result}">${t.result === 'win' ? 'W' : 'L'}</div>
      <div class="trade-main">
        <div class="trade-pnl ${t.result}">${fmtPnL(t.pnl)}</div>
        ${metaHtml}
        ${notesHtml}
      </div>
      <div class="trade-actions">
        <button class="trade-action-btn" data-act="edit" aria-label="Edit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="trade-action-btn" data-act="dup" aria-label="Duplicate">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
        <button class="trade-action-btn" data-act="del" aria-label="Delete">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
    </div>`;
  },

  bindTradeItemActions(scope){
    $$(`${scope} .trade-item`).forEach(el => {
      const id = el.dataset.id;
      $$('button[data-act]', el).forEach(btn => {
        btn.addEventListener('click', () => {
          const act = btn.dataset.act;
          if(act === 'edit') this.openTradeSheet({id});
          else if(act === 'dup') this.duplicateTrade(id);
          else if(act === 'del') this.confirmDelete(id);
        });
      });
    });
  },

  escape(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  },

  // ---------- TRADES LIST ----------
  renderTrades(){
    const f = this.state.filters;
    // Filters row
    let filtersHtml = `<div class="filter-chips">
      <button class="filter-chip ${f.result==='all'?'active':''}" data-filter="result" data-val="all">All</button>
      <button class="filter-chip ${f.result==='win'?'active':''}" data-filter="result" data-val="win">Wins</button>
      <button class="filter-chip ${f.result==='loss'?'active':''}" data-filter="result" data-val="loss">Losses</button>
      <button class="filter-chip ${f.pnl==='all'?'active':''}" data-filter="pnl" data-val="all">Any PnL</button>
      <button class="filter-chip ${f.pnl==='positive'?'active':''}" data-filter="pnl" data-val="positive">Positive</button>
      <button class="filter-chip ${f.pnl==='negative'?'active':''}" data-filter="pnl" data-val="negative">Negative</button>
      <button class="filter-chip" id="filter-range">Range: ${f.range === 'all' ? 'All' : (f.start||'?')+' → '+(f.end||'?')}</button>
      <button class="filter-chip" id="filter-symbol">${f.symbol ? 'Symbol: '+f.symbol : 'Symbol: any'}</button>
    </div>`;

    let trades = Store.getTrades().slice();
    // result filter
    if(f.result !== 'all') trades = trades.filter(t => t.result === f.result);
    // pnl filter
    if(f.pnl === 'positive') trades = trades.filter(t => t.pnl > 0);
    if(f.pnl === 'negative') trades = trades.filter(t => t.pnl < 0);
    // range
    if(f.range === 'custom' && f.start && f.end){
      trades = trades.filter(t => t.date >= f.start && t.date <= f.end);
    }
    // symbol
    if(f.symbol){
      const sym = f.symbol.toLowerCase();
      trades = trades.filter(t => t.symbol && t.symbol.toLowerCase().includes(sym));
    }
    // sort newest first
    trades.sort((a,b) => {
      if(a.date !== b.date) return a.date > b.date ? -1 : 1;
      return b.timestamp - a.timestamp;
    });

    let html = filtersHtml;
    const s = Stats.compute(trades);

    // summary strip
    html += `<div class="card mb-12" style="padding:12px 14px;">
      <div class="row-flex spread" style="margin-bottom:6px;">
        <div class="fs-12 muted">Filtered</div>
        <div class="fs-12 fw-700 ${s.totalPnl>0?'text-win':(s.totalPnl<0?'text-loss':'')}">${fmtPnL(s.totalPnl)}</div>
      </div>
      <div class="row-flex" style="gap:14px;flex-wrap:wrap;">
        <div class="fs-13"><span class="muted">Trades</span> <span class="fw-700">${s.total}</span></div>
        <div class="fs-13"><span class="muted">Winrate</span> <span class="fw-700">${fmtPct(s.winrate)}</span></div>
        <div class="fs-13"><span class="muted">Avg</span> <span class="fw-700">${fmtPnL(s.avgPnl)}</span></div>
      </div>
    </div>`;

    if(trades.length === 0){
      html += `<div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <h3>No trades match filters</h3>
        <p>Adjust filters or add a new trade.</p>
      </div>`;
    }else{
      for(const t of trades){
        html += this.renderTradeItem(t, true);
      }
    }

    $('#trades-filters').innerHTML = filtersHtml;
    $('#trades-content').innerHTML = `<div style="margin-top:12px;"></div>${html.substring(filtersHtml.length)}`;

    // bind filter chips
    $$('.filter-chip[data-filter]').forEach(chip => {
      chip.addEventListener('click', () => {
        const key = chip.dataset.filter;
        const val = chip.dataset.val;
        this.state.filters[key] = val;
        this.renderTrades();
      });
    });
    $('#filter-range').addEventListener('click', () => this.openRangeFilter());
    $('#filter-symbol').addEventListener('click', () => this.openSymbolFilter());
    this.bindTradeItemActions('#trades-content');
  },

  openRangeFilter(){
    const f = this.state.filters;
    const html = `<div style="display:flex;flex-direction:column;gap:12px;">
      <div class="segmented" id="range-mode">
        <button class="${f.range==='all'?'active':''}" data-v="all">All time</button>
        <button class="${f.range==='custom'?'active':''}" data-v="custom">Custom</button>
      </div>
      <div>
        <label class="field-label">Start date</label>
        <input type="date" class="input" id="rf-start" value="${f.start||''}">
      </div>
      <div>
        <label class="field-label">End date</label>
        <input type="date" class="input" id="rf-end" value="${f.end||''}">
      </div>
    </div>`;
    this.openConfirm({
      title: 'Date Range Filter',
      bodyHtml: html,
      okText: 'Apply',
      okClass: 'btn-primary',
      onOk: () => {
        const mode = $('#range-mode button.active').dataset.v;
        f.range = mode;
        if(mode === 'custom'){
          f.start = $('#rf-start').value;
          f.end = $('#rf-end').value;
          if(!f.start || !f.end){ toast('Pick both dates','error'); return false; }
          if(f.start > f.end){ toast('Start must be before end','error'); return false; }
        }
        this.renderTrades();
        return true;
      }
    });
    // bind segmented
    $$('#range-mode button').forEach(b => b.addEventListener('click', () => {
      $$('#range-mode button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    }));
  },

  openSymbolFilter(){
    const f = this.state.filters;
    const html = `<div>
      <label class="field-label">Symbol contains</label>
      <input type="text" class="input" id="sf-symbol" value="${this.escape(f.symbol)}" placeholder="e.g. ES, EURUSD">
    </div>`;
    this.openConfirm({
      title: 'Filter by Symbol',
      bodyHtml: html,
      okText: 'Apply',
      okClass: 'btn-primary',
      onOk: () => {
        f.symbol = $('#sf-symbol').value.trim();
        this.renderTrades();
        return true;
      }
    });
  },

  // ---------- STATISTICS ----------
  renderStatistics(){
    const tab = this.state.statTab;
    const trades = Store.getTrades();
    let html = '';

    if(trades.length === 0){
      html = `<div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="4" y1="20" x2="4" y2="10"/><line x1="10" y1="20" x2="10" y2="4"/><line x1="16" y1="20" x2="16" y2="14"/><line x1="22" y1="20" x2="2" y2="20"/></svg>
        <h3>No data yet</h3>
        <p>Add trades to see statistics.</p>
      </div>`;
      $('#stats-content').innerHTML = html;
      return;
    }

    if(tab === 'all'){
      const s = Stats.compute(trades);
      const pf = s.profitFactor;
      const pfStr = pf === Infinity ? '∞' : (pf === 0 ? '0.00' : pf.toFixed(2));
      html += `<div class="hero-pnl">
        <div class="hero-label">Total PnL (All Time)</div>
        <div class="hero-value">${fmtPnL(s.totalPnl)}</div>
        <div class="hero-sub">
          <div><div class="muted" style="opacity:.8;font-size:11px;">Trades</div><div class="sub-val">${s.total}</div></div>
          <div><div class="muted" style="opacity:.8;font-size:11px;">Winrate</div><div class="sub-val">${fmtPct(s.winrate)}</div></div>
        </div>
      </div>`;

      html += `<div class="stat-grid">
        <div class="stat-card"><div class="lbl">Wins</div><div class="val win">${s.wins}</div><div class="sub">avg ${fmtPnL(s.avgWin)}</div></div>
        <div class="stat-card"><div class="lbl">Losses</div><div class="val loss">${s.losses}</div><div class="sub">avg ${fmtPnL(s.avgLoss)}</div></div>
        <div class="stat-card"><div class="lbl">Best</div><div class="val win">${fmtPnL(s.best)}</div></div>
        <div class="stat-card"><div class="lbl">Worst</div><div class="val loss">${fmtPnL(s.worst)}</div></div>
      </div>`;

      html += `<div class="section-title">Performance Metrics</div>
      <div class="card">
        <div class="detail-meta-list">
          <div class="meta-row"><span class="k">Profit Factor</span><span class="v">${pfStr}</span></div>
          <div class="meta-row"><span class="k">Expectancy</span><span class="v">${fmtPnL(s.expectancy)}</span></div>
          <div class="meta-row"><span class="k">Avg PnL / trade</span><span class="v">${fmtPnL(s.avgPnl)}</span></div>
          <div class="meta-row"><span class="k">Gross Profit</span><span class="v text-win">${fmtPnL(s.wins*s.avgWin)}</span></div>
          <div class="meta-row"><span class="k">Gross Loss</span><span class="v text-loss">${fmtPnL(s.losses*s.avgLoss)}</span></div>
          <div class="meta-row"><span class="k">Max Drawdown</span><span class="v">${fmtMoney(Stats.drawdownMax(trades))}</span></div>
        </div>
      </div>`;

      // Cumulative line chart
      const series = Stats.cumulativeSeries(trades);
      html += `<div class="section-title">Cumulative PnL</div>
      <div class="chart-wrap">
        <div class="chart-title">Equity Curve</div>
        <div class="chart-sub">${series.length} trades · Final ${fmtPnL(series[series.length-1].cumulative)}</div>
        ${Chart.cumulativeLine(series,{width:340,height:160})}
      </div>`;

      // Monthly bars (last 6 months)
      const monthly = Stats.monthlyStats(trades).slice(-6);
      if(monthly.length > 0){
        const bars = monthly.map(m => ({
          value: m.totalPnl,
          label: new Date(m.key+'-01').toLocaleDateString(undefined,{month:'short'})
        }));
        html += `<div class="section-title">Monthly PnL (last 6)</div>
        <div class="chart-wrap">
          ${Chart.bars(bars,{width:340,height:140})}
        </div>`;
      }

    }else if(tab === 'monthly'){
      const monthly = Stats.monthlyStats(trades);
      html += `<div class="section-title">Monthly Breakdown</div>`;
      if(monthly.length === 0){
        html += `<div class="empty-state"><h3>No data</h3></div>`;
      }else{
        // bar chart of all months
        const bars = monthly.map(m => ({
          value: m.totalPnl,
          label: new Date(m.key+'-01').toLocaleDateString(undefined,{month:'short',year:'2-digit'})
        }));
        html += `<div class="chart-wrap">${Chart.bars(bars,{width:340,height:150})}</div>`;

        for(const m of monthly.slice().reverse()){
          html += this.renderGroupStat(m.key, m, new Date(m.key+'-01').toLocaleDateString(undefined,{month:'long',year:'numeric'}));
        }
      }

    }else if(tab === 'weekly'){
      const weekly = Stats.weeklyStats(trades);
      html += `<div class="section-title">Weekly Breakdown</div>`;
      if(weekly.length === 0){
        html += `<div class="empty-state"><h3>No data</h3></div>`;
      }else{
        const bars = weekly.slice(-10).map(w => ({
          value: w.totalPnl,
          label: 'W' + w.key.split('-W')[1]
        }));
        if(bars.length > 0){
          html += `<div class="chart-wrap">
            <div class="chart-title">Last ${bars.length} weeks</div>
            ${Chart.bars(bars,{width:340,height:140})}
          </div>`;
        }
        for(const w of weekly.slice().reverse()){
          const label = `Week of ${w.start.toLocaleDateString(undefined,{month:'short',day:'numeric'})}`;
          html += this.renderGroupStat(w.key, w, label);
        }
      }

    }else if(tab === 'daily'){
      const daily = Stats.dailyStats(trades);
      html += `<div class="section-title">Daily Breakdown</div>`;
      if(daily.length === 0){
        html += `<div class="empty-state"><h3>No data</h3></div>`;
      }else{
        // bar chart of last 14 trading days
        const recent = daily.slice(-14);
        const bars = recent.map(d => ({
          value: d.totalPnl,
          label: new Date(d.date).toLocaleDateString(undefined,{month:'numeric',day:'numeric'})
        }));
        html += `<div class="chart-wrap">
          <div class="chart-title">Last ${recent.length} trading days</div>
          ${Chart.bars(bars,{width:340,height:140})}
        </div>`;

        for(const d of daily.slice().reverse()){
          html += this.renderGroupStat(d.date, d, fmtDateLong(d.date), true);
        }
      }
    }

    $('#stats-content').innerHTML = html;
  },

  renderGroupStat(key, s, label, isDaily){
    const cls = s.totalPnl > 0 ? 'text-win' : (s.totalPnl < 0 ? 'text-loss' : '');
    return `<div class="card mb-12" data-group="${key}">
      <div class="row-flex spread" style="margin-bottom:6px;">
        <div class="fw-700 fs-13">${this.escape(label)}</div>
        <div class="fw-700 ${cls}">${fmtPnL(s.totalPnl)}</div>
      </div>
      <div class="row-flex" style="gap:14px;flex-wrap:wrap;font-size:12px;">
        <span><span class="muted">Trades</span> <span class="fw-700">${s.total}</span></span>
        <span><span class="muted">WR</span> <span class="fw-700">${fmtPct(s.winrate)}</span></span>
        <span><span class="muted text-win">W</span> <span class="fw-700">${s.wins}</span></span>
        <span><span class="muted text-loss">L</span> <span class="fw-700">${s.losses}</span></span>
        <span><span class="muted">Avg</span> <span class="fw-700">${fmtPnL(s.avgPnl)}</span></span>
      </div>
    </div>`;
  },

          <div class="lbl">Theme</div>
          <div class="desc">Light, dark, or follow system</div>

        <div class="segmented" id="theme-seg">

      </div>
      <div class="setting-row">
        <div><div class="lbl">Max drawdown limit</div><div class="desc">USD — alert threshold</div></div>
        <input class="setting-input" type="number" step="0.01" id="set-maxdd" value="${s.maxDrawdown || ''}">
      </div>
      <div class="setting-row">
        <div><div class="lbl">Daily drawdown limit</div><div class="desc">USD — alert threshold</div></div>

      </div>
      <div class="setting-row">
        <div><div class="lbl">Export CSV</div><div class="desc">Trades only — spreadsheet format</div></div>
        <div class="ctrl"><button class="btn btn-outline" style="min-height:0;padding:8px 14px;font-size:13px;" id="btn-export-csv">Export</button></div>
      </div>
      <div class="setting-row">
        <div><div class="lbl">Import JSON</div><div class="desc">Replace or merge with existing</div></div>
        <div class="ctrl"><button class="btn btn-outline" style="min-height:0;padding:8px 14px;font-size:13px;" id="btn-import">Import</button></div>
      </div>
      <div class="setting-row">
        <div><div class="lbl" style="color:var(--loss);">Clear all data</div><div class="desc">Permanently delete all trades</div></div>
        <div class="ctrl"><button class="btn btn-danger" style="min-height:0;padding:8px 14px;font-size:13px;" id="btn-clear">Clear</button></div>
      </div>
    </div>`;

    // Stats
    const trades = Store.getTrades();
    html += `<div class="section-title">Storage</div>
    <div class="card">
      <div class="detail-meta-list">
        <div class="meta-row"><span class="k">Total trades stored</span><span class="v">${trades.length}</span></div>

      });
    };
    ['set-startbal','set-maxdd','set-dailydd','set-target'].forEach(id => {
      const el = $('#' + id);
      if(el) el.addEventListener('change', () => { saveAccount(); toast('Saved'); });
    });

    // export
    $('#btn-export-json').addEventListener('click', () => this.downloadFile('trading-journal-backup.json', Store.exportJSON(), 'application/json'));
    $('#btn-export-csv').addEventListener('click', () => this.downloadFile('trading-journal-trades.csv', Store.exportCSV(), 'text/csv'));
    $('#btn-import').addEventListener('click', () => this.openImportFlow());
    $('#btn-clear').addEventListener('click', () => this.confirmClearAll());
  },

  storageSize(){
    try{
      let total = 0;
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith('tpj_')){
          total += (localStorage.getItem(k)||'').length;
        }
      }
      if(total < 1024) return total + ' B';
      return (total/1024).toFixed(1) + ' KB';
    }catch(e){ return 'unknown'; }
  },

  downloadFile(filename, content, mime){
    try{
      const blob = new Blob([content], {type: mime});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
      toast('Downloaded ' + filename, 'success');
    }catch(e){
      toast('Download failed','error');
    }
  },

  openImportFlow(){
    const html = `<div style="display:flex;flex-direction:column;gap:12px;">
      <div>
        <label class="field-label">Select JSON file</label>
        <input type="file" accept=".json,application/json" class="input" id="imp-file" style="padding:8px;">
      </div>
      <div>
        <label class="field-label">Import mode</label>
        <div class="segmented" id="imp-mode">
          <button class="active" data-v="merge">Merge (skip existing)</button>
          <button data-v="replace">Replace all</button>
        </div>
      </div>
      <div class="fs-12 muted">Merge keeps existing trades by ID. Replace deletes all current data first.</div>
    </div>`;
    this.openConfirm({
      title: 'Import Trades',
      bodyHtml: html,
      okText: 'Import',
      okClass: 'btn-primary',
      onOk: () => {
        const file = $('#imp-file').files[0];
        if(!file){ toast('Please pick a file','error'); return false; }
        const mode = $('#imp-mode button.active').dataset.v;
        const reader = new FileReader();
        reader.onload = (e) => {
          try{
            const parsed = JSON.parse(e.target.result);
            let arr;
            if(Array.isArray(parsed)) arr = parsed;
            else if(parsed && Array.isArray(parsed.trades)) arr = parsed.trades;
            else throw new Error('JSON must be an array of trades or an object with a "trades" array.');
            if(arr.length === 0){ toast('No trades found in file','error'); return; }
            let result;
            if(mode === 'replace'){
              result = Store.replaceAll(arr);
            }else{
              result = Store.mergeAll(arr);
            }
            this.closeConfirm();
            const msg = mode === 'replace'
              ? `Imported ${result.count} trades${result.skipped?` (${result.skipped} invalid skipped)`:''}`
              : `Added ${result.added}, skipped ${result.skipped} existing${result.invalid?`, ${result.invalid} invalid`:''}`;
            toast(msg, 'success');
            this.render();
          }catch(err){
            toast('Import failed: ' + err.message, 'error');
          }
        };
        reader.onerror = () => toast('Could not read file','error');
        reader.readAsText(file);
        // we close dialog after async completes — return true to keep open until then? No, async reads after dialog closes.
        // Actually, since reader is async, we return false so dialog stays open briefly... but we want it to close.
        // We'll handle closing inside onload. Return false so confirm doesn't auto-close.
        return false;
      }
    });
    // bind mode segmented
    $$('#imp-mode button').forEach(b => b.addEventListener('click', () => {
      $$('#imp-mode button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    }));
  },

  confirmClearAll(){
    const trades = Store.getTrades();
    if(trades.length === 0){
      toast('No data to clear');
      return;
    }
    this.openConfirm({
      title: 'Clear All Data',
      bodyHtml: `<div style="line-height:1.5;">This will permanently delete all <strong style="color:var(--loss);">${trades.length} trades</strong> from this device.<br><br>Type <strong>DELETE</strong> below to confirm.</div>
      <input type="text" class="input" id="clear-confirm-input" placeholder="DELETE" style="margin-top:12px;">`,
      okText: 'Clear All',
      okClass: 'btn-danger',
      onOk: () => {
        const val = $('#clear-confirm-input').value.trim();
        if(val !== 'DELETE'){
          toast('Type DELETE to confirm','error');
          return false;
        }
        Store.clearAll();
        toast('All data cleared','success');
        this.render();
        return true;
      }
    });
  },

  // ---------- TRADE SHEET ----------
  openTradeSheet(opts){
    opts = opts || {};
    let trade = null;
    if(opts.id){
      trade = Store.getTrades().find(t => t.id === opts.id);
      if(!trade){ toast('Trade not found','error'); return; }
      this.state.editingTradeId = opts.id;
      $('#sheet-title').textContent = 'Edit Trade';
    }else{
      this.state.editingTradeId = null;
      $('#sheet-title').textContent = 'Add Trade';
    }

    $('#f-date').value = (trade && trade.date) || opts.date || todayStr();
    $('#f-pnl').value = trade ? Math.abs(trade.pnl).toFixed(2) : '';
    $('#f-symbol').value = (trade && trade.symbol) || '';
    $('#f-entry').value = (trade && trade.entryTime) || '';
    $('#f-notes').value = (trade && trade.notes) || '';

    this.setSheetResult(trade ? trade.result : 'win');

    $('#trade-sheet').classList.add('open');
    document.body.style.overflow = 'hidden';
    setTimeout(() => $('#f-pnl').focus(), 280);
  },

  closeTradeSheet(){
    $('#trade-sheet').classList.remove('open');
    document.body.style.overflow = '';
    this.state.editingTradeId = null;
  },

  setSheetResult(r){
    this.state.sheetResult = r;
    $('#wl-win').classList.toggle('active', r === 'win');
    $('#wl-loss').classList.toggle('active', r === 'loss');
  },

  saveTradeFromForm(){
    const date = $('#f-date').value;
    const pnlRaw = parseFloat($('#f-pnl').value);
    const result = this.state.sheetResult;
    const symbol = $('#f-symbol').value.trim();
    const entryTime = $('#f-entry').value.trim();
    const notes = $('#f-notes').value.trim();

    if(!date){ toast('Pick a date','error'); return; }
    if(isNaN(pnlRaw) || pnlRaw < 0){ toast('Enter a valid PnL amount','error'); return; }
    const pnl = result === 'win' ? Math.abs(pnlRaw) : -Math.abs(pnlRaw);

    const payload = {
      date, result, pnl, symbol, entryTime, notes,
      timestamp: Date.now()
    };

    if(this.state.editingTradeId){
      Store.updateTrade(this.state.editingTradeId, payload);
      toast('Trade updated','success');
    }else{
      Store.addTrade(payload);
      toast('Trade added','success');
    }
    this.closeTradeSheet();
    this.render();
  },

  // ---------- TRADE ACTIONS ----------
  duplicateTrade(id){
    const t = Store.duplicateTrade(id);
    if(t){
      toast('Trade duplicated','success');
      this.render();
    }
  },

  confirmDelete(id){
    const t = Store.getTrades().find(x => x.id === id);
    if(!t) return;
    this.openConfirm({
      title: 'Delete Trade',
      bodyHtml: `<div>Delete this trade?</div>
      <div style="margin-top:10px;padding:10px;background:var(--surface-2);border-radius:8px;">
        <div class="fw-700 ${t.result === 'win' ? 'text-win' : 'text-loss'}">${fmtPnL(t.pnl)}</div>
        <div class="fs-12 muted">${fmtDateMed(t.date)}${t.symbol?' · '+this.escape(t.symbol):''}</div>
      </div>`,
      okText: 'Delete',
      okClass: 'btn-danger',
      onOk: () => {
        Store.deleteTrade(id);
        toast('Trade deleted','success');
        this.render();
        return true;
      }
    });
  },

  // ---------- CONFIRM DIALOG ----------
  openConfirm(opts){
    this._confirmCb = opts.onOk;
    $('#confirm-title').textContent = opts.title || 'Confirm';
    $('#confirm-body').innerHTML = opts.bodyHtml || opts.body || '';
    const okBtn = $('#confirm-ok');
    okBtn.textContent = opts.okText || 'OK';
    okBtn.className = 'btn ' + (opts.okClass || 'btn-primary');
    $('#confirm-dialog').classList.add('open');
  },

  closeConfirm(){
    $('#confirm-dialog').classList.remove('open');
    this._confirmCb = null;
  }
};

// bind confirm OK
document.addEventListener('DOMContentLoaded', () => {
  $('#confirm-ok').addEventListener('click', () => {
    if(UI._confirmCb){
      const result = UI._confirmCb();
      if(result !== false) UI.closeConfirm();
    }else{
      UI.closeConfirm();
    }
  });
  UI.init();
});

})();
</script>
</body>
</html>
